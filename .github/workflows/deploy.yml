name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Validate HTML
        run: npx --yes html-validate index.html || true

      - name: Lint JavaScript syntax
        run: |
          for f in assets/js/*.js; do
            node --input-type=module --check < "$f" && echo "ok  $f"
          done

      - name: Check internal links resolve
        run: node scripts/check-links.mjs

  deploy:
    name: Deploy to Netlify
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: npx --yes netlify-cli@17 deploy --prod --dir=.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
